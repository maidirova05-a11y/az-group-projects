# /etc/nginx/sites-available/azgroup-site  (certbot сам добавит блоки ssl и редирект на https)
upstream azgroup_site_node { server 127.0.0.1:3200; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name azgroup.kz www.azgroup.kz az-group.kz www.az-group.kz;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://azgroup_site_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: клиент не может подделать свой IP (TRUST_PROXY=1 берёт первый адрес)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
