    <script>
      (function () {
        var p = null, d = document.documentElement;
        // Язык страницы по префиксу пути (/kk/…, /en/…) — до загрузки скриптов; дальше его ведёт src/i18n.
        var l = /^\/(kk|en)(\/|$)/.exec(location.pathname);
        if (l) d.lang = l[1];
        try { p = localStorage.getItem('az-theme'); } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var t = dark ? 'dark' : 'light';
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        if (p === 'light' || p === 'dark') {
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) m[i].setAttribute('content', dark ? '#111317' : '#f0f2f4');
        }
      })();
    </script>
